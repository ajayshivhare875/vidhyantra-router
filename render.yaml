services:
  - type: web
    name: codepro-ai
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: RUN_BOT
        value: "1"
      - key: VIDHYANTRA_CODEX_KEY
        sync: false
      - key: VIDHYANTRA_GET_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
