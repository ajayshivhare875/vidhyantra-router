services:
  - type: web
    name: vidhyantra-router
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend:app --bind 0.0.0.0:$PORT --workers 2 --timeout 150
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: VIDHYANTRA_CODEX_KEY
        sync: false
      - key: VIDHYANTRA_GET_KEY
        sync: false
